# a70q: the q6 ADSP audio path cannot keep up with PipeWire's default 512-frame quantum
# (~10 ms): the speaker node xruns ~30 times per second (choppy Bluetooth A2DP playback, ERRORS
# C59). Force a 2048-frame quantum (~43 ms @48 kHz) while the q6 card nodes are running.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-soc_qcom_msm-audio-apr*" }
      { node.name = "~alsa_input.platform-soc_qcom_msm-audio-apr*" }
    ]
    actions = {
      update-props = {
        node.force-quantum = 2048
      }
    }
  }
  # mainline kernel (sm8250-sndcard "Samsung Galaxy A70"): no UCM; the stereo fallback profile is
  # tied to an unavailable headphone port, so use the pro-audio profile (speaker = WSA codec DMA,
  # routed by a70q-mainline-modem)
  {
    matches = [
      { device.name = "alsa_card.platform-soc_0_sound" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  # mainline card: the q6asm front end takes 2 channel 16-bit PCM; the pro-audio node would open
  # it 8 channels / 32 bit and every buffer is refused ("Error queuing playback buffer -16")
  {
    matches = [
      { node.name = "~alsa_output.platform-soc_0_sound*" }
    ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.format = "S16LE"
        audio.position = [ FL, FR ]
        node.force-quantum = 2048
      }
    }
  }
  # mainline card capture (TX codec DMA, one ADC): the DSP rejects 2 channels / 32 bit (AFE
  # error 9 at prepare) -> mono 16-bit
  {
    matches = [
      { node.name = "~alsa_input.platform-soc_0_sound*" }
    ]
    actions = {
      update-props = {
        audio.channels = 1
        audio.format = "S16LE"
        audio.position = [ MONO ]
      }
    }
  }
]
