# MultiMedia1 (PCM 0) front end, routed to WSA speaker / WCD937x headphones+earpiece,
# captured from TX_CDC_DMA_TX_3 (WCD937x ADCs via SoundWire).
SectionVerb {
	EnableSequence [
		# q6 DPCM: hw_params on a front end fails (EINVAL) unless a back end is routed, and
		# PipeWire/ACP probes the PCMs before enabling any device -> keep MultiMedia1 routed
		# to the WSA speaker back end at verb level; the Speaker device only gates the amp
		cset "name='WSA_CDC_DMA_RX_0 Channels' One"
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		# codec defaults from the vendor mixer_paths_idp.xml (applied by Android's audio HAL at
		# boot). Without "RX HPH Mode" the headphone PA stays CLS_H_INVALID: very quiet + hum
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='HPHL Volume' 17"
		cset "name='HPHR Volume' 17"
		cset "name='WSA_RX0 Digital Volume' 84"
		# capture front end
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 98"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [ "Headphones" "Earpiece" ]
	EnableSequence [
		# re-assert the WSA back end route (normally set by the verb, see above)
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 1"
		cset "name='SpkrLeft SWR DAC_Port Switch' 1"
	]
	DisableSequence [
		cset "name='SpkrLeft SWR DAC_Port Switch' 0"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [ "Speaker" "Earpiece" ]
	EnableSequence [
		# the WSA back end stalls the shared front end when its amp is off
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX_CDC_DMA_RX_0 Channels' Two"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 1"
		cset "name='RX_COMP2 Switch' 1"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='RX_RX0 HPH Digital Volume' 73"
		cset "name='RX_RX1 HPH Digital Volume' 73"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		# kcontrol added by kernel patch 0008 (downstream MBHC only had the input device)
		JackControl "Headphone Jack"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [ "Speaker" "Headphones" ]
	EnableSequence [
		# the WSA back end stalls the shared front end when its amp is off
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_CDC_DMA_RX_0 Channels' One"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='RX_RX0 Digital Volume' 79"
		cset "name='EAR PA Gain' G_6_DB"
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='RX_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='WSA_CDC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 50
	}
}

SectionDevice."Mic" {
	Comment "Main microphone"
	ConflictingDevice [ "HeadsetMic" ]
	EnableSequence [
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='ADC1 Volume' 0"
		cset "name='ADC1_MIXER Switch' 1"
	]
	DisableSequence [
		cset "name='ADC1_MIXER Switch' 0"
	]
	Value {
		CapturePCM "hw:${CardId},0"
		CapturePriority 100
	}
}

SectionDevice."HeadsetMic" {
	Comment "Headset microphone"
	ConflictingDevice [ "Mic" ]
	EnableSequence [
		cset "name='TX SMIC MUX0' ADC2"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Volume' 0"
		cset "name='ADC2_MIXER Switch' 1"
	]
	DisableSequence [
		cset "name='ADC2_MIXER Switch' 0"
	]
	Value {
		CapturePCM "hw:${CardId},0"
		CapturePriority 200
		JackControl "Headset Mic Jack"
	}
}
