# Sxmo/sway handle the power key themselves. With elogind defaults (HandlePowerKey=poweroff)
# every power key press -- also the one that wakes the phone from suspend -- shut the phone
# down (PMIC "Power-off reason: PS_HOLD", ERRORS C52). The Samsung cover hall sensor is a lid
# switch for elogind and must not suspend/power off either.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
