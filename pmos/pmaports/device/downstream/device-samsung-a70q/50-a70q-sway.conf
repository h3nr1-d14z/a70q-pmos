# a70q panel: 1080x2400, rounded corners r=60px, waterdrop notch top-centre 189x76px
# (LineageOS overlay: rounded_corner_radius 60px, config_mainBuiltInDisplayCutout, density 420).
# Sxmo runs sway at scale 2.5 -> 432x960 logical: corners r=24, notch x=178..254, depth ~30.5.
# Sxmo's sway config includes /etc/sway/config.d/* after its own bar block (id bar-0).
bar bar-0 {
	# as tall as the notch (Android's status bar is 77px for the same reason)
	height 31
	# keep the workspace button and the clock out of the rounded corners
	gaps 0 14 0 14
	# clickable status icons (a70q-statusbar.py): tap/click volume = audio menu (wheel = volume,
	# middle = mute), wifi = networks, battery = details, clock = date + calendar, lock icon = system menu
	status_command /usr/libexec/a70q/a70q-statusbar.py
	# no tray: its only icon would be fcitx5 (shown as a red "missing icon" face, no keyboard icon in
	# the Sxmo icon set); VI/EN is a status block instead
	tray_output none
	# right click anywhere on the bar = main menu; left click on workspaces works as usual
	bindsym button3 exec sxmo_appmenu.sh
}

# keyboard: Menu key = app menu, Shift+Menu = system menu (Sxmo defaults Super+P /
# Super+Shift+P keep working). In a menu: arrows + Enter, Esc closes, "Back" goes up a level.
bindsym Menu exec sxmo_appmenu.sh
bindsym Shift+Menu exec sxmo_appmenu.sh sys
